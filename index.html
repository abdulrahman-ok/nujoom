<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>النجمات</title>
<meta name="theme-color" content="#2a1f6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="النجمات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
:root{
  --sky-top:#2a1f6b; --sky-bot:#6b3fa0; --ink:#fffaf0; --ink-soft:#d9cff5;
  --star:#ffd23f; --star-deep:#f4a300; --card:#ffffff; --card-ink:#2a1f4f;
  --pink:#ff6fae; --mint:#3ddcb0; --sky:#4cb5ff; --coral:#ff8a5c;
  --font:"Baloo Bhaijaan 2","Geeza Pro","Arial Rounded MT Bold",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:var(--ink);
  background:linear-gradient(180deg,var(--sky-top),var(--sky-bot)) fixed;
  background-color:var(--sky-top);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font-family:inherit;cursor:pointer;border:0}
button:focus-visible{outline:4px solid var(--star);outline-offset:3px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.6rem}
.brand .logo{width:44px;height:44px}
.bar-actions{display:flex;gap:8px;align-items:center}
.pill{background:rgba(255,255,255,.14);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:1.05rem;font-weight:700;display:inline-flex;align-items:center;gap:8px}
button.pill:hover{background:rgba(255,255,255,.24)}
.starcount{background:var(--star);color:var(--card-ink);font-variant-numeric:tabular-nums}
.sync{font-size:.9rem;padding:6px 12px}
.sync i{width:10px;height:10px;border-radius:50%;background:#9a8fc4;display:inline-block}
.sync.on i{background:var(--mint)} .sync.off i{background:var(--coral)}

h1,h2{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800}
h2{font-size:1.4rem;font-weight:800}
.sub{color:var(--ink-soft);font-size:1.15rem;margin:4px 0 0}

.bar-who{justify-content:flex-end}
.hero{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px}
.hero-title{font-size:clamp(3rem,10vw,4.6rem);font-weight:800;line-height:1.1;color:var(--star);text-shadow:0 4px 0 rgba(0,0,0,.18)}
.hero-stars{display:flex;gap:14px;font-size:clamp(1.8rem,5vw,2.4rem)}
.hero-stars span{display:inline-block;animation:twinkle 2.4s ease-in-out infinite}
.hero-stars span:nth-child(2){animation-delay:.4s;transform:translateY(-6px)}
.hero-stars span:nth-child(3){animation-delay:.8s;transform:translateY(-6px)}
.hero-stars span:nth-child(4){animation-delay:1.2s}
@keyframes twinkle{50%{opacity:.55;scale:.85}}
.center{text-align:center}
.center .sub{margin-top:6px}

.kids{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%;max-width:800px;margin:8px auto 0}
@media (max-width:600px){.kids{grid-template-columns:repeat(2,minmax(0,1fr));max-width:420px}}
.kid{position:relative;background:var(--card);color:var(--card-ink);border-radius:24px;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;
  box-shadow:0 6px 0 var(--shade,#c9b8f0);transition:transform .15s;cursor:pointer}
.kid:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shade,#c9b8f0)}
.kid .face{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:44px;background:var(--c)}
.kid .name{font-size:1.35rem;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kid .stars{font-size:1.05rem;font-weight:700;color:#8a5a00;font-variant-numeric:tabular-nums}
.kid .edit{position:absolute;top:8px;inset-inline-end:8px;width:32px;height:32px;border-radius:50%;background:#f1ecff;color:var(--card-ink);font-size:.9rem;padding:0}
.crown{position:absolute;top:-16px;font-size:28px}

.hello{display:flex;align-items:center;gap:14px}
.hello .face{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:var(--c);flex:none}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.game{border-radius:28px;padding:20px;color:var(--card-ink);text-align:start;display:flex;flex-direction:column;gap:6px;min-height:170px;position:relative;overflow:hidden;
  box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .15s}
.game:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.game .ico{font-size:52px;line-height:1}
.game .t{font-size:1.5rem;font-weight:800}
.game .d{font-size:1.05rem;opacity:.8}
.game .best{margin-top:auto;font-size:.95rem;font-weight:700;background:rgba(255,255,255,.55);align-self:flex-start;padding:3px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.g-mem{background:#ffd9ec}.g-sim{background:#c9f5e7}.g-tap{background:#fff1b8}.g-math{background:#d6e4ff}.g-draw{background:#ffe1cc}
.modes.drmodes{grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,640px)}
@media (max-width:560px){.modes.drmodes{grid-template-columns:1fr}}
.pages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:min(100%,640px)}
@media (max-width:560px){.pages{grid-template-columns:1fr 1fr}}
.page-btn{background:var(--card);color:var(--card-ink);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;font-weight:800;font-size:1.1rem;box-shadow:0 6px 0 #c9b8f0}
.page-btn canvas{width:100%;height:auto;border-radius:12px;border:2px solid #eee8ff}
.dr-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.dr-topic{font-size:1.3rem;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 18px}
.dr-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.dr-group{display:flex;gap:6px;background:rgba(255,255,255,.12);border-radius:16px;padding:5px}
.dr-tool{width:48px;height:48px;border-radius:12px;background:transparent;font-size:1.6rem;line-height:1}
.dr-tool.on{background:var(--card);box-shadow:0 3px 0 var(--star-deep)}
.dr-size{width:44px;height:48px;border-radius:12px;background:transparent;display:grid;place-items:center}
.dr-size i{display:block;border-radius:50%;background:var(--ink)}
.dr-size.on{background:var(--card)} .dr-size.on i{background:var(--card-ink)}
.dr-save{background:var(--star);color:var(--card-ink);border-radius:12px;padding:0 16px;height:48px;font-size:1.15rem;font-weight:800;box-shadow:0 3px 0 var(--star-deep)}
.dr-pal{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:760px}
.dr-col{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.55);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.dr-col.on{outline:4px solid var(--star);outline-offset:2px}
.dr-stk{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);font-size:1.7rem;line-height:1}
.dr-stk.on{background:var(--card)}
.dr-board{position:relative;width:min(100%,calc((100vh - 340px) * 4 / 3),1000px);aspect-ratio:4/3;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.dr-board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#lines{pointer-events:none}
.dr-lock{position:absolute;inset:0;background:rgba(42,31,107,.55);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2rem;font-weight:800;gap:6px}
.dr-lock small{font-size:1.2rem}
.dr-prev{width:100%;border-radius:14px;border:3px solid #eee8ff}
.dr-big{width:100%;border-radius:16px;border:3px solid #eee8ff}
.gal-wrap{display:flex;flex-direction:column;gap:12px;width:100%;align-self:stretch}
.gal-filter{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.gal-item{background:var(--card);color:var(--card-ink);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center;font-weight:800;box-shadow:0 5px 0 #c9b8f0;min-width:0}
.gal-item img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#fff}
.gal-item small{font-weight:600;opacity:.7;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--card);color:var(--card-ink);font-weight:800;padding:12px 20px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:40;transition:transform .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.mt-setup{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(100%,560px)}
.mt-group{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.mt-q{font-size:1.3rem;font-weight:800}
.mt-opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.mt-op{width:78px;height:78px;border-radius:22px;background:rgba(255,255,255,.14);color:var(--ink);border:3px solid rgba(255,255,255,.3);font-size:2.2rem;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.mt-op small{font-size:.8rem;font-weight:700;margin-top:4px}
.mt-op.on,.mt-pill.on{background:var(--card);color:var(--card-ink);border-color:var(--star);box-shadow:0 4px 0 var(--star-deep)}
.mt-pill{background:rgba(255,255,255,.14);color:var(--ink);border:3px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 18px;font-size:1.15rem;font-weight:800}
.mt-pill small{font-size:.85rem;color:#8a5a00}
.mt-hint{color:var(--ink-soft);text-align:center;max-width:440px;font-size:1rem;line-height:1.5}
.mt-play{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.mt-eq{display:flex;gap:.3em;align-items:center;justify-content:center;flex-wrap:nowrap;white-space:nowrap;font-size:clamp(1.7rem,8vw,4.4rem);font-weight:800;background:var(--card);color:var(--card-ink);border-radius:28px;padding:10px clamp(14px,4vw,28px);min-width:min(100%,420px);max-width:100%;box-shadow:0 6px 0 #c9b8f0;transition:background .15s}
.mt-eq .op{color:var(--sky-bot)}
.mt-eq .ans{min-width:1.6em;text-align:center;border-bottom:5px solid #d9cff5}
.mt-eq .ans.empty{color:#b7a9e6}
.mt-eq.good{background:#d8ffe9}
.mt-eq.bad{background:#ffe0e4;animation:shake .4s}
.mt-fb{min-height:1.6em;font-size:1.4rem;font-weight:800;color:#ffd0d6}
.mt-choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(100%,420px)}
.mt-choice{background:var(--card);color:var(--card-ink);border-radius:24px;padding:18px 8px;font-size:2.2rem;font-weight:800;box-shadow:0 6px 0 #c9b8f0}
.mt-choice:active{transform:translateY(3px);box-shadow:0 3px 0 #c9b8f0}
.mt-choice.good{background:#9ff0c6}
.mt-choice.bad{background:#ffb3bf}
.mt-keys .key{background:var(--card)}
.key-ok{background:#9ff0c6 !important;color:#145c3a}
.soon{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.locked{border-radius:24px;padding:16px 18px;border:2px dashed rgba(255,255,255,.35);display:flex;gap:12px;align-items:center;color:var(--ink-soft)}
.locked .ico{font-size:34px}
.locked b{color:var(--ink);font-size:1.15rem;display:block}

.gamehead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.stage{background:rgba(255,255,255,.1);border-radius:28px;padding:16px;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;overflow:hidden}

.mem{--gap:clamp(5px,1.2vw,12px);display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:var(--gap);
  width:min(100%, 640px, calc((100vh - 230px) * var(--cols,4) / var(--rows,3)))}
.mem .card,.mem .card .f,.mem .card .b{border-radius:calc(var(--cw,80px) * .2)}
.mem .card .b{font-size:calc(var(--cw,80px) * .45)}
.mem .card .f{font-size:calc(var(--cw,80px) * .62)}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:min(100%,520px)}
.size{background:var(--card);color:var(--card-ink);border-radius:22px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 #c9b8f0;position:relative}
.size:active{transform:translateY(4px);box-shadow:0 2px 0 #c9b8f0}
.size.chosen{outline:4px solid var(--star);outline-offset:2px}
.sz-n{font-size:2.2rem;font-weight:800;line-height:1}
.sz-l{font-size:1rem;font-weight:700;opacity:.7}
.sz-s{font-size:.85rem;letter-spacing:1px}
.sz-b{font-size:.85rem;font-weight:700;color:#8a5a00}
.sz-scale{display:flex;justify-content:space-between;width:min(100%,520px);color:var(--ink-soft);font-weight:700}
.card{aspect-ratio:1;max-width:100%;border-radius:20px;perspective:600px;background:none;padding:0}
.card .in{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .b{background:var(--star);box-shadow:inset 0 -6px 0 var(--star-deep);color:var(--card-ink)}
.card .f{background:var(--card);transform:rotateY(180deg)}
.card.done .f{background:#d8ffe9}

.stage{--c0:#ff5fa8;--c1:#22d3a5;--c2:#3b9dff;--c3:#ff9a1f;--c4:#ffe03a;--c5:#9d6bff;--c6:#6fd63a;--c7:#e8333f}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(420px,100%,calc(100vh - 300px))}
.simon.p8{grid-template-columns:repeat(4,1fr);width:min(620px,100%,calc((100vh - 300px) * 2))}
@media (max-width:560px){.simon.p8{grid-template-columns:1fr 1fr;width:min(100%,calc((100vh - 300px) / 2))}}
.pad{aspect-ratio:1;border-radius:28%;opacity:.78;filter:saturate(.85);transition:opacity .1s,transform .1s,filter .1s;box-shadow:inset 0 -8px 0 rgba(0,0,0,.2);background:var(--pc);color:var(--pc)}
.pad.lit{opacity:1;filter:saturate(1.15) brightness(1.15);transform:scale(1.08);box-shadow:0 0 40px currentColor,inset 0 -8px 0 rgba(0,0,0,.2)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(100%,420px)}
.dotrow{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:90px;margin-top:4px}
.dotrow i{width:14px;height:14px;border-radius:50%;display:block}
.speed{background:rgba(255,255,255,.14);color:var(--ink);border:3px solid rgba(255,255,255,.35);border-radius:999px;padding:10px 26px;font-size:1.25rem;font-weight:800}
.speed.on{background:var(--star);color:var(--card-ink);border-color:var(--star-deep)}
.simon.wait .pad{pointer-events:none}
.msg{font-size:1.5rem;font-weight:800;text-align:center;min-height:2.2em}

.arena{position:relative;width:100%;height:60vh;min-height:320px;touch-action:manipulation}
.target{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;background:none;font-size:60px;line-height:76px;padding:0;animation:pop .25s ease-out}
.target.gone{animation:vanish .25s forwards;pointer-events:none}
.plus{position:absolute;font-weight:800;font-size:1.6rem;color:var(--star);pointer-events:none;animation:rise .7s forwards}
.plus.minus{color:#ff5d6c;font-size:2rem}
.target.bomb{filter:drop-shadow(0 0 6px rgba(255,80,80,.7))}
.target.hit{animation:none;transform:scale(1.6);opacity:1}
.arena.shake{animation:shake .4s}
.arena-msg{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(1.6rem,5vw,2.4rem);font-weight:800;text-align:center;padding:16px;text-shadow:0 3px 0 rgba(0,0,0,.3);animation:pop .3s}
.tapmodes .mode{padding:16px 12px}
.tm-t{font-size:1.35rem;font-weight:800}
.tm-d{font-size:.95rem;opacity:.75;line-height:1.35}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes vanish{to{transform:scale(1.8);opacity:0}}
@keyframes rise{to{transform:translateY(-50px);opacity:0}}

.big{background:var(--star);color:var(--card-ink);font-size:1.5rem;font-weight:800;border-radius:999px;padding:12px 34px;box-shadow:0 6px 0 var(--star-deep)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 var(--star-deep)}
.ghost{background:rgba(255,255,255,.16);color:var(--ink);font-size:1.2rem;font-weight:700;border-radius:999px;padding:10px 24px}
.soft{background:#f1ecff;color:var(--card-ink)}

.overlay{position:fixed;inset:0;background:rgba(20,10,50,.6);display:flex;z-index:20;padding:20px;overflow-y:auto}
.overlay>.sheet{margin:auto}
.sheet{background:var(--card);color:var(--card-ink);border-radius:32px;padding:26px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;animation:pop .3s}
.sheet h2{font-size:1.8rem}
.won{font-size:56px;letter-spacing:4px}
.won span{display:inline-block;animation:pop .4s backwards}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sheet input{font-family:inherit;font-size:1.4rem;padding:10px 16px;border-radius:16px;border:3px solid #e2dbff;width:100%;text-align:center;color:var(--card-ink);background:#fff;user-select:text;-webkit-user-select:text}
.sheet input:focus{outline:none;border-color:var(--sky-bot)}
.pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pick button{width:52px;height:52px;border-radius:50%;font-size:30px;background:#f3efff;border:3px solid transparent}
.pick button[aria-pressed="true"]{border-color:var(--sky-bot)}
.pick.colors button{font-size:0}
.danger{background:none;color:#c0396b;font-weight:700;font-size:1rem;text-decoration:underline}
.note{font-size:.95rem;color:var(--ink-soft);text-align:center;margin:0}
.guest-btn{background:rgba(255,255,255,.12);color:var(--ink);border:2px dashed rgba(255,255,255,.45);border-radius:999px;padding:8px 22px;font-size:1.1rem;font-weight:700}
.guest-btn:active{transform:translateY(2px)}
.pin-sheet{gap:10px;width:min(360px,100%)}
.pin-face{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:42px}
.pin-name{font-size:1.5rem;font-weight:800;line-height:1}
.pin-title{font-size:1.15rem;font-weight:700;color:#5a4f80}
.dots{display:flex;gap:12px;direction:ltr;padding:6px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid #c5b6f5;display:block;transition:background .1s}
.dots i.on{background:var(--sky-bot);border-color:var(--sky-bot)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-msg{min-height:1.4em;font-weight:700;color:#c0396b;font-size:1rem}
.keypad{display:grid;grid-template-columns:repeat(3,68px);gap:12px;justify-content:center}

async function hashPin(id,pin){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("najmat:"+id+":"+pin));
  return Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,"0")).join("");
}

const kidRef = id => F.doc(F.db,"kids",id);
function cloudSet(k){ if(F) F.setDoc(kidRef(k.id), clean(k)).catch(onCloudError); }
function cloudReward(k,stars,game,value,isBest){
  if(!F) return;
  const patch={stars:F.increment(stars)}; if(isBest) patch["best."+game]=value;
  F.updateDoc(kidRef(k.id),patch).catch(()=>cloudSet(k));
}
function cloudDelete(id){ if(F) F.deleteDoc(kidRef(id)).catch(onCloudError); }
function onCloudError(e){ console.warn(e); setSync(e&&e.code==="unavailable"?"nonet":"off"); }

// ================= sound =================
let ac=null;
function tone(freq,dur=.15,type="sine",vol=.18){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=vol;
    o.connect(g);g.connect(ac.destination);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
    o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}
const chime=()=>{[660,880,1320].forEach((f,i)=>setTimeout(()=>tone(f,.25,"triangle"),i*110))};

const num = n => Number(n).toLocaleString(lang==="ar"?"ar-SA":"en-US");
function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar"?"rtl":"ltr";
  document.title = t("app");
}
function go(v){ if(cleanup){cleanup();cleanup=null} if(v==="who"||v==="login"||v==="pending"){ currentId=null; guest=null; $("#layer").innerHTML=""; } view=v; render(); window.scrollTo(0,0); }
function setSync(s){ sync=s; const el=$("#syncPill"); if(el){ el.className="pill sync "+(s==="on"?"on":s==="wait"?"":"off"); el.lastChild.textContent=" "+syncLabel(); } }
const syncLabel = () => sync==="on"?t("syncOn"):sync==="wait"?t("syncWait"):t("syncOff");

const logo = `<svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4l5.6 12.2L43 17.8l-10 9.2 2.7 13.3L24 33.6 12.3 40.3 15 27 5 17.8l13.4-1.6z" fill="#ffd23f" stroke="#f4a300" stroke-width="2" stroke-linejoin="round"/><circle cx="19" cy="23" r="2" fill="#2a1f4f"/><circle cx="29" cy="23" r="2" fill="#2a1f4f"/><path d="M19.5 28q4.5 4 9 0" stroke="#2a1f4f" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;

function topBar(){
  const k = cur();
  const plain = view==="who"||view==="login"||view==="pending";
  return `<div class="bar${plain?" bar-who":""}">
    ${plain ? "" : `<div class="brand">${logo}<span>${t("app")}</span></div>`}
    <div class="bar-actions">
      ${k && view!=="who" ? `<span class="pill starcount">⭐ ${num(k.stars||0)}</span>`:""}
      ${view==="who" ? `<span class="pill sync ${sync==="on"?"on":sync==="wait"?"":"off"}" id="syncPill"><i></i> ${syncLabel()}</span>`:""}
      <button class="pill" id="langBtn">${t("lang")}</button>
    </div>
  </div>`;
}

// ================= views =================
function render(){
  applyLang();
  const app = $("#app");
  if(view==="hub" && !cur()) view=role?"who":"pending";
  if(view==="login") app.innerHTML = topBar()+loginView();
  else if(view==="pending") app.innerHTML = topBar()+pendingView();
  else if(view==="who") app.innerHTML = topBar()+whoView();
  else if(view==="hub") app.innerHTML = topBar()+hubView();
  else app.innerHTML = topBar()+gameShell();
  $("#langBtn").onclick = () => { lang = lang==="ar"?"en":"ar"; LS.set("nj_lang",lang); if(view.startsWith("g-")) go("hub"); else render(); };
  // Parent settings are hidden: press and hold the big title for 2 seconds.
  const ht = view==="who" && $(".hero-title");
  if(ht){ let lp=null; const stop=()=>clearTimeout(lp);
    ht.onpointerdown=()=>{ stop(); lp=setTimeout(()=>{ tone(440,.15,"triangle"); role==="admin"?openSettings():openDeviceSettings(); },2000); };
    ht.onpointerup=stop; ht.onpointerleave=stop; ht.onpointercancel=stop;
    ht.oncontextmenu=e=>e.preventDefault(); }
  if(view==="login") bindLogin();
  if(view==="pending") bindPending();
  if(view==="who") bindWho();
  if(view==="hub") bindHub();
  if(view==="g-mem") startMemory();
  if(view==="g-sim") startSimon();
  if(view==="g-tap") startTap();
  if(view==="g-math") startMath();
  if(view==="g-draw") startDraw();
}
function refreshStars(){
  const k=cur(), sc=document.querySelector(".starcount");
  if(sc&&k) sc.textContent=`⭐ ${num(k.stars||0)}`;
}

function bindLogin(){
  const msg=$("#loginMsg"), btn=$("#loginBtn");
  const lb=$("#loginBack"); if(lb) lb.onclick=()=>go(role?"who":"pending");
  $("#loginForm").onsubmit=async e=>{
    e.preventDefault();
    if(!A){ msg.textContent=t("loginNet"); return; }
    btn.disabled=true; btn.textContent=t("loggingIn"); msg.textContent="";
    if(myRequest && F && uid) F.deleteDoc(F.doc(F.db,"requests",uid)).catch(()=>{});
    try{ await A.signIn(A.auth, $("#em").value.trim(), $("#pw").value); }
    catch(err){
      const c=(err&&err.code)||"";
      msg.textContent = c.includes("network") ? t("loginNet")
        : /invalid|wrong-password|user-not-found|invalid-email/.test(c) ? t("loginBad") : t("loginErr");
      btn.disabled=false; btn.textContent=t("loginBtn");
    }
  };
  $("#forgot").onclick=async()=>{
    const em=$("#em").value.trim();
    if(!em){ msg.textContent=t("forgotNeedEmail"); return; }
    if(!A){ msg.textContent=t("loginNet"); return; }
    try{ await A.reset(A.auth, em); msg.style.color="#1f8a5b"; msg.textContent=t("forgotSent"); }
    catch(err){ msg.textContent=t("loginErr"); }
  };
}

// ================= reward =================
function reward(game, value, better, stars, line){
  const k = cur(); if(!k) return;
  k.best = k.best||{};
  const prev = game.startsWith("mem") ? memBest(k.best, +game.slice(3)) : game.startsWith("sim") ? simBest(k.best, game) : game==="tap60" ? tapBest(k.best,"t") : k.best[game];
  const isBest = prev==null || better(value,prev);
  if(isBest) k.best[game]=value;
  k.stars = (k.stars||0)+stars;
  if(!isGuest() && (stars>0 || isBest)){ cacheKids(); cloudReward(k,stars,game,value,isBest); }
  refreshStars();
  if(stars>0) chime(); else tone(440,.2,"triangle");
  const starsHtml = Array.from({length:stars},(_,i)=>`<span style="animation-delay:${i*.12}s">⭐</span>`).join("");
  $("#layer").innerHTML = `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">
    <h2>${stars>0?t("win"):t("tryAgain")}</h2>
    ${stars>0?`<div class="won" aria-hidden="true">${starsHtml}</div>`:""}
    <div style="font-size:1.4rem;font-weight:800">${stars>0?t("got")(num(stars)):t("noStars")}</div>
    <div style="font-size:1.1rem">${line}</div>
    ${isBest && prev!=null ? `<div style="font-size:1.2rem;font-weight:800;color:#c05a00">${t("newBest")}</div>`:""}
    <div class="row"><button class="big" id="again">${t("again")}</button><button class="ghost soft" id="toHub">${t("home")}</button></div>
  </div></div>`;
  $("#again").onclick=()=>{ $("#layer").innerHTML=""; go(view); };
  $("#toHub").onclick=()=>{ memAgain=false; simAgain=false; tapAgain=false; mtAgain=false; $("#layer").innerHTML=""; go("hub"); };
}

// ================= game 1: memory =================
const MEM_SIZES=[6,12,18,24,30,36];
const MEM_COLS={6:3,12:4,18:6,24:6,30:6,36:6};
const MEM_POOL=["🐶","🐱","🦁","🐸","🐵","🐙","🦒","🐳","🦜","🐨","🐼","🦊","🐰","🐯","🐮","🦉","🐧","🦋","🐢","🦄","🐝","🐞","🦀","🐬"];
const memSize=()=>{ const n=LS.get("nj_memsize",12); return MEM_SIZES.includes(n)?n:12; };
// Best moves are kept per board size. The old 12-card record (before sizes existed) counts as 12.
const memBest=(b,n)=>b["mem"+n] || (n===12 ? b.mem : null);
let memAgain=false;   // "Play again" skips the size picker and replays the same size

function startMemory(){
  bindBack();
  if(memAgain){ memAgain=false; playMemory(memSize()); return; }
  $("#hud").innerHTML="";
  const b=(cur()||{}).best||{}, chosen=memSize();
  $("#stage").innerHTML=`<div class="msg">${t("memPick")}</div>
    <div class="sizes">${MEM_SIZES.map((n,i)=>`<button class="size${n===chosen?" chosen":""}" data-n="${n}">
      <span class="sz-n">${num(n)}</span><span class="sz-l">${t("cards")}</span>
      <span class="sz-s" aria-hidden="true">${"⭐".repeat(1+Math.floor(i/2))}</span>
      ${memBest(b,n)?`<span class="sz-b">🏆 ${num(memBest(b,n))}</span>`:""}</button>`).join("")}</div>
    <div class="sz-scale"><span>${t("memEasy")}</span><span>${t("memHard")}</span></div>`;
  document.querySelectorAll(".size").forEach(btn=>btn.onclick=()=>{ const n=+btn.dataset.n; LS.set("nj_memsize",n); tone(660,.1,"triangle"); playMemory(n); });
}

function playMemory(n){
  const pairs=n/2, cols=MEM_COLS[n], rows=n/cols;
  const pool=[...MEM_POOL].sort(()=>Math.random()-.5).slice(0,pairs);
  const deck=[...pool,...pool].sort(()=>Math.random()-.5);
  let open=[],moves=0,found=0,lock=false;
  const hud=()=>$("#hud").innerHTML=`<span class="pill">${t("moves")}: ${num(moves)}</span><span class="pill">${t("pairs")}: ${num(found)}/${num(pairs)}</span>`;
  hud();
  $("#stage").innerHTML=`<div class="mem" style="--cols:${cols};--rows:${rows}">${deck.map((e,i)=>`<button class="card" data-i="${i}" aria-label="?"><span class="in"><span class="b">★</span><span class="f">${e}</span></span></button>`).join("")}</div>`;
  const grid=$(".mem");
  const fit=()=>{ const c=grid.querySelector(".card"); if(c) grid.style.setProperty("--cw", c.offsetWidth+"px"); };
  fit(); addEventListener("resize",fit);
  cleanup=()=>removeEventListener("resize",fit);
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>{
    if(lock||c.classList.contains("up")||c.classList.contains("done")) return;
    c.classList.add("up"); tone(520,.08,"triangle"); open.push(c);
    if(open.length<2) return;
    moves++; hud();
    const [a,b]=open;
    if(deck[a.dataset.i]===deck[b.dataset.i]){
      setTimeout(()=>{a.classList.add("done");b.classList.add("done");tone(988,.18,"triangle");found++;hud();open=[];
        if(found===pairs){
          // 1-3 stars for how few moves it took, plus up to 2 more for a bigger board (max 5).
          const r=moves/pairs, skill=r<=1.5?3:r<=2.2?2:1, size=MEM_SIZES.indexOf(n)>>1;
          const k="mem"+n;
          setTimeout(()=>{ memAgain=true; reward(k,moves,(v,p)=>v<p,Math.min(5,skill+size),`${num(n)} ${t("cards")} · ${t("moves")}: ${num(moves)}`); },500);
        }
      },250);
    } else {
      lock=true;
      setTimeout(()=>{a.classList.remove("up");b.classList.remove("up");open=[];lock=false},800);
    }
  });
}

// ================= game 2: color challenge =================
const SIM_NOTES=[523,587,659,698,784,880,988,1047];
const simMode=()=>{ const pads=LS.get("nj_simpads",4)===8?8:4, fast=!!LS.get("nj_simfast",false);
  return {pads, fast, key:"sim"+pads+(fast?"f":"")}; };
const simLabel=m=>`${num(m.pads)} ${t("colors")}${m.fast?" ⚡":""}`;
// Best level is kept per mode. The old record (before modes existed) counts as 4 colors, normal speed.
const simBest=(b,key)=>b[key] || (key==="sim4" ? b.sim : null);
let simAgain=false;

function startSimon(){
  bindBack();
  if(simAgain){ simAgain=false; playSimon(simMode()); return; }
  $("#hud").innerHTML="";
  let m=simMode();
  const b=(cur()||{}).best||{};
  const draw=()=>{
    $("#stage").innerHTML=`<div class="msg">${t("simPick")}</div>
      <div class="modes">${[4,8].map(n=>{ const key="sim"+n+(m.fast?"f":""), best=simBest(b,key);
        return `<button class="size mode${n===m.pads?" chosen":""}" data-p="${n}">
          <span class="sz-n">${num(n)}</span><span class="sz-l">${t("colors")}</span>
          <span class="dotrow" aria-hidden="true">${Array.from({length:n},(_,i)=>`<i style="background:var(--c${i})"></i>`).join("")}</span>
          ${best?`<span class="sz-b">🏆 ${num(best)}</span>`:""}</button>`; }).join("")}</div>
      <button class="speed${m.fast?" on":""}" id="speed" aria-pressed="${m.fast}">⚡ ${t("fast")}</button>
      <button class="big" id="go">${t("start")}</button>`;
    document.querySelectorAll(".mode").forEach(btn=>btn.onclick=()=>{ LS.set("nj_simpads",+btn.dataset.p); m=simMode(); tone(660,.08,"triangle"); draw(); });
    $("#speed").onclick=()=>{ LS.set("nj_simfast",!m.fast); m=simMode(); tone(m.fast?990:520,.1,"triangle"); draw(); };
    $("#go").onclick=()=>playSimon(m);
  };
  draw();
}

function playSimon(m){
  const n=m.pads, sp=m.fast?.5:1;
  let seq=[],pos=0,timers=[],alive=true;
  cleanup=()=>{alive=false;timers.forEach(clearTimeout)};
  const hud=()=>$("#hud").innerHTML=`<span class="pill">${simLabel(m)}</span><span class="pill">${t("level")}: ${num(Math.max(seq.length,1))}</span>`;
  $("#stage").innerHTML=`<div class="msg" id="msg">${t("watch")}</div>
    <div class="simon wait p${n}" id="simon">${Array.from({length:n},(_,i)=>`<button class="pad" data-i="${i}" style="--pc:var(--c${i})" aria-label="${i+1}"></button>`).join("")}</div>`;
  hud();
  const pads=[...document.querySelectorAll(".pad")], board=$("#simon"), msg=$("#msg");
  const flash=(i,d)=>{pads[i].classList.add("lit");tone(SIM_NOTES[i],d/1000,"sine",.22);timers.push(setTimeout(()=>pads[i].classList.remove("lit"),d))};
  function next(){
    seq.push(Math.floor(Math.random()*n)); pos=0; hud();
    board.classList.add("wait"); msg.textContent=t("watch");
    const gap=Math.max(320,650-seq.length*25)*sp, lead=600*sp;
    seq.forEach((p,i)=>timers.push(setTimeout(()=>alive&&flash(p,gap*.65),lead+i*gap)));
    timers.push(setTimeout(()=>{if(!alive)return;board.classList.remove("wait");msg.textContent=t("yourTurn")},lead+seq.length*gap));
  }
  pads.forEach(p=>p.onclick=()=>{
    const i=+p.dataset.i; flash(i,220*sp);
    if(i!==seq[pos]){
      board.classList.add("wait"); msg.textContent=t("oops"); tone(180,.4,"sawtooth",.12);
      const lvl=seq.length-1;
      if(lvl<1){ timers.push(setTimeout(()=>{ if(alive){ simAgain=true; go("g-sim"); } },1200)); return; }
      // Stars grow with the level reached; 8 colors and double speed each add one (max 5).
      const s=Math.min(5,Math.max(1,Math.ceil(lvl/2)+(n===8?1:0)+(m.fast?1:0)));
      timers.push(setTimeout(()=>{ if(alive){ simAgain=true; reward(m.key,lvl,(v,p)=>v>p,s,`${simLabel(m)} · ${t("level")}: ${num(lvl)}`); } },900));
      return;
    }
    pos++;
    if(pos===seq.length){ board.classList.add("wait"); timers.push(setTimeout(()=>alive&&next(),700*sp)); }
  });
  timers.push(setTimeout(()=>alive&&next(),300));
}

// ================= game 3: star catcher =================
const tapMode=()=>LS.get("nj_tapmode","t")==="s"?"s":"t";
// Best score per mode. The old 30-second record (before modes existed) counts toward the timed mode.
const tapBest=(b,m)=>m==="s" ? b.tapS : (b.tap60 || b.tap);
const mmss=sec=>{ const m=Math.floor(sec/60), x=sec%60; return num(m)+":"+(x<10?num(0):"")+num(x); };
let tapAgain=false;

function startTap(){
  bindBack();
  if(tapAgain){ tapAgain=false; playTap(tapMode()); return; }
  $("#hud").innerHTML="";
  const b=(cur()||{}).best||{}, chosen=tapMode();
  $("#stage").innerHTML=`<div class="msg">${t("tapPick")}</div>
    <div class="modes tapmodes">${[["t","⏱️","tapTimed","tapTimedD"],["s","💣","tapSurv","tapSurvD"]].map(([m,ico,ti,de])=>`
      <button class="size mode${m===chosen?" chosen":""}" data-m="${m}">
        <span class="sz-n">${ico}</span><span class="tm-t">${t(ti)}</span><span class="tm-d">${t(de)}</span>
        ${tapBest(b,m)?`<span class="sz-b">🏆 ${num(tapBest(b,m))}</span>`:""}</button>`).join("")}</div>`;

function playTap(mode){
  const timed = mode==="t", LIMIT=60;
  let score=0, sec=0, timers=[], tick=null, alive=true, over=false;
  cleanup=()=>{alive=false;timers.forEach(clearTimeout);clearInterval(tick)};
  const hud=()=>$("#hud").innerHTML=`<span class="pill">${t("score")}: ${num(score)}</span><span class="pill">⏱ ${timed?num(LIMIT-sec):mmss(sec)}</span>`;
  hud();
  $("#stage").innerHTML=`<div class="arena" id="arena"></div>`;
  const arena=$("#arena");
  const floater=(b,text,cls)=>{ const p=document.createElement("span"); p.className="plus"+(cls?" "+cls:""); p.textContent=text; p.style.left=b.style.left; p.style.top=b.style.top; arena.appendChild(p); timers.push(setTimeout(()=>p.remove(),700)); };
  // It gets harder over time: things appear faster, vanish sooner, and there are more bombs.
  const pace=()=> timed
    ? {every:Math.max(300,750-sec*8),  life:Math.max(700,1500-sec*12), bomb:.15+Math.min(.12,sec*.002)}
    : {every:Math.max(280,800-sec*6),  life:Math.max(650,1600-sec*10), bomb:.15+Math.min(.2,sec*.004)};
  function end(why){
    if(over) return; over=true; clearInterval(tick); timers.forEach(clearTimeout); timers=[];
    document.querySelectorAll(".target").forEach(x=>x.classList.add("gone"));
    const msg=document.createElement("div"); msg.className="arena-msg"; msg.textContent=why; arena.appendChild(msg);
    const s = timed ? Math.min(5,Math.max(1,Math.floor(score/15))) : Math.min(5,Math.max(1,Math.floor(score/10)));
    const line = timed ? `${t("tapTimed")} · ${t("score")}: ${num(score)}` : `${t("tapSurv")} · ${t("score")}: ${num(score)} · ${t("duration")}: ${mmss(sec)}`;
    setTimeout(()=>{ if(!alive) return; tapAgain=true; reward(timed?"tap60":"tapS",score,(v,p)=>v>p,s,line); }, 1100);
  }
  function spawn(){
    if(!alive||over) return;
    const pc=pace(), r=Math.random();
    const kind = r<pc.bomb ? "bomb" : r<pc.bomb+.1 ? "comet" : "star";
    const b=document.createElement("button");
    b.className="target"+(kind==="bomb"?" bomb":"");
    b.textContent = kind==="bomb"?"💣":kind==="comet"?"☄️":"⭐";
    b.setAttribute("aria-label", kind==="bomb"?"💣":kind==="comet"?"+3":"+1");
    b.style.left=(10+Math.random()*80)+"%"; b.style.top=(12+Math.random()*76)+"%";
    b.onpointerdown=e=>{
      e.preventDefault(); if(over||b.classList.contains("gone")) return;
      b.classList.add("gone");
      if(kind==="bomb"){
        tone(140,.35,"sawtooth",.16); arena.classList.remove("shake"); void arena.offsetWidth; arena.classList.add("shake");
        if(!timed){ b.classList.add("hit"); end(t("boom")); return; }
        score=Math.max(0,score-3); floater(b,"−3","minus");
      } else {
        const add=kind==="comet"?3:1; score+=add; tone(kind==="comet"?1320:880+Math.random()*200,.1,"triangle"); floater(b,"+"+add);
      }
      hud(); timers.push(setTimeout(()=>b.remove(),400));
    };
    arena.appendChild(b);
    timers.push(setTimeout(()=>{ if(!b.classList.contains("gone")){ b.classList.add("gone"); timers.push(setTimeout(()=>b.remove(),300)); } }, kind==="comet"?Math.min(900,pc.life):pc.life));
    timers.push(setTimeout(spawn,pc.every));
  }
  spawn(); spawn();
  tick=setInterval(()=>{ sec++; hud(); if(timed && sec>=LIMIT) end(t("timeUp")); },1000);
}

// Settings are remembered per device: which operations, how hard, and how to play.
const MT_OPS=["add","sub","mul","div"], MT_SIGN={add:"+",sub:"−",mul:"×",div:"÷"};
const MT_LEVELS=["e","m","h"], MT_MODES=["t","s","p"];
const mtCfg=()=>{
  let ops=LS.get("nj_mtops",["add","sub"]); if(!Array.isArray(ops)) ops=["add","sub"];
  ops=ops.filter(o=>MT_OPS.includes(o)); if(!ops.length) ops=["add"];
  const lvl=MT_LEVELS.includes(LS.get("nj_mtlvl","e"))?LS.get("nj_mtlvl","e"):"e";
  const mode=MT_MODES.includes(LS.get("nj_mtmode","t"))?LS.get("nj_mtmode","t"):"t";
  return {ops,lvl,mode,key:"mt_"+mode+"_"+lvl};
};
const mtModeName=m=>t(m==="t"?"tapTimed":m==="s"?"tapSurv":"mtPractice");
const mtLvlName=l=>t(l==="e"?"mtEasy":l==="m"?"mtMid":"mtHard");
let mtAgain=false;

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
// One question for the chosen operation and level. Subtraction never goes below zero,
// and division always comes out even (it is built from a multiplication).
function mtQuestion(op,lvl){
  let a,b,ans;
  if(op==="add"){
    if(lvl==="e"){ a=rnd(1,10); b=rnd(1,10); }
    else if(lvl==="m"){ a=rnd(5,95); b=rnd(1,100-a); }
    else { a=rnd(100,999); b=rnd(10,999); }
    ans=a+b;
  } else if(op==="sub"){
    if(lvl==="e"){ a=rnd(2,20); b=rnd(1,a); }
    else if(lvl==="m"){ a=rnd(10,100); b=rnd(1,a); }
    else { a=rnd(100,999); b=rnd(10,a); }
    ans=a-b;
  } else {
    let x,y;
    if(lvl==="e"){ x=rnd(1,5); y=rnd(1,10); }
    else if(lvl==="m"){ x=rnd(2,10); y=rnd(1,10); }
    else if(Math.random()<.3){ x=rnd(2,9); y=rnd(11,30); }
    else { x=rnd(2,12); y=rnd(2,12); }
    if(Math.random()<.5) [x,y]=[y,x];
    if(op==="mul"){ a=x; b=y; ans=x*y; }
    else { if(x===0) x=1; a=x*y; b=x; ans=y; }
  }
  return {a,b,op,ans};
}
// Three wrong answers close to the right one, never negative, all different.
function mtChoices(q){
  const set=new Set([q.ans]);
  const near=[1,2,3,4,5,10];
  let guard=0;
  while(set.size<4 && guard++<100){
    const d=near[rnd(0,near.length-1)]*(Math.random()<.5?-1:1), v=q.ans+d;
    if(v>=0) set.add(v);
  }
  return [...set].sort(()=>Math.random()-.5);
}

function startMath(){

  if(mtAgain){ mtAgain=false; playMath(mtCfg()); return; }
  $("#hud").innerHTML="";

  const draw=()=>{
    $("#stage").innerHTML=`<div class="mt-setup">

        <div class="mt-opts">${MT_OPS.map(o=>`<button class="mt-op${c.ops.includes(o)?" on":""}" data-op="${o}" aria-pressed="${c.ops.includes(o)}" aria-label="${t("mt_"+o)}">${MT_SIGN[o]}<small>${t("mt_"+o)}</small></button>`).join("")}</div></div>
      <div class="mt-group"><div class="mt-q">${t("mtLvlQ")}</div>
        <div class="mt-opts">${MT_LEVELS.map(l=>`<button class="mt-pill${c.lvl===l?" on":""}" data-lvl="${l}" aria-pressed="${c.lvl===l}">${l==="e"?"🟢":l==="m"?"🟡":"🔴"} ${mtLvlName(l)}</button>`).join("")}</div>
        <div class="mt-hint">${t(c.lvl==="e"?"mtEasyD":c.lvl==="m"?"mtMidD":"mtHardD")}</div></div>
      <div class="mt-group"><div class="mt-q">${t("tapPick")}</div>
        <div class="mt-opts">${MT_MODES.map(m=>{ const best=m==="p"?null:b["mt_"+m+"_"+c.lvl];
          return `<button class="mt-pill${c.mode===m?" on":""}" data-mode="${m}" aria-pressed="${c.mode===m}">${m==="t"?"⏱️":m==="s"?"💣":"📝"} ${mtModeName(m)}${best?` <small>🏆 ${num(best)}</small>`:""}</button>`; }).join("")}</div>
        <div class="mt-hint">${t(c.mode==="t"?"mtTimedD":c.mode==="s"?"mtSurvD":"mtPracticeD")}</div></div>
      <button class="big" id="go">${t("start")}</button></div>`;
    document.querySelectorAll("[data-op]").forEach(x=>x.onclick=()=>{

      if(!ops.length) return;               // at least one operation stays on
      LS.set("nj_mtops",MT_OPS.filter(o=>ops.includes(o))); c=mtCfg(); tone(620,.07,"triangle"); draw(); });
    document.querySelectorAll("[data-lvl]").forEach(x=>x.onclick=()=>{ LS.set("nj_mtlvl",x.dataset.lvl); c=mtCfg(); tone(660,.07,"triangle"); draw(); });
    document.querySelectorAll("[data-mode]").forEach(x=>x.onclick=()=>{ LS.set("nj_mtmode",x.dataset.mode); c=mtCfg(); tone(700,.07,"triangle"); draw(); });
    $("#go").onclick=()=>playMath(c);
  };
  draw();
}

function playMath(c){
  const LIMIT=60, choices=c.lvl==="e";
  let q=null, last="", entry="", right=0, wrong=0, sec=0, busy=false, over=false, alive=true, timers=[], tick=null;
  const onKey=e=>{ if(choices||busy||over) return;
    if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==="Backspace") press("del"); else if(e.key==="Enter") press("ok"); };
  cleanup=()=>{ alive=false; timers.forEach(clearTimeout); clearInterval(tick); document.removeEventListener("keydown",onKey); };
  document.addEventListener("keydown",onKey);
  const hud=()=>$("#hud").innerHTML=`<span class="pill">✅ ${num(right)}</span>${c.mode==="p"?`<span class="pill">❌ ${num(wrong)}</span>`:""}<span class="pill">⏱ ${c.mode==="t"?num(LIMIT-sec):mmss(sec)}</span>`;
  $("#stage").innerHTML=`<div class="mt-play">
    <div class="mt-eq" id="eq" dir="ltr"></div>
    <div class="mt-fb" id="fb"></div>
    ${choices?`<div class="mt-choices" id="ch"></div>`
      :`<div class="keypad mt-keys" dir="ltr">${["1","2","3","4","5","6","7","8","9","del","0","ok"].map(k=>
        k==="del"?`<button class="key key-x" data-mk="del" aria-label="${t("del")}">⌫</button>`
        :k==="ok"?`<button class="key key-ok" data-mk="ok" aria-label="✓">✓</button>`
        :`<button class="key" data-mk="${k}">${num(k)}</button>`).join("")}</div>`}
    ${c.mode==="p"?`<button class="ghost" id="mtEnd">🏁 ${t("mtFinish")}</button>`:""}
  </div>`;
  const eq=$("#eq"), fb=$("#fb");
  const showEq=()=>{ eq.innerHTML=`<span>${num(q.a)}</span><span class="op">${MT_SIGN[q.op]}</span><span>${num(q.b)}</span><span class="op">=</span><span class="ans${entry===""?" empty":""}">${entry===""?"؟":entry.split("").map(num).join("")}</span>`; };
  function next(){
    entry=""; fb.textContent=""; fb.className="mt-fb"; eq.classList.remove("good","bad");
    let k=0; do{ q=mtQuestion(c.ops[rnd(0,c.ops.length-1)],c.lvl); }while(q.a+q.op+q.b===last && k++<10);
    last=q.a+q.op+q.b; showEq(); busy=false;
    if(choices){
      $("#ch").innerHTML=mtChoices(q).map(v=>`<button class="mt-choice" data-v="${v}">${num(v)}</button>`).join("");
      document.querySelectorAll(".mt-choice").forEach(x=>x.onclick=()=>answer(+x.dataset.v,x));
    }
  }
  function answer(v,btn){
    if(busy||over) return; busy=true;
    entry=String(v); showEq();
    if(v===q.ans){
      right++; hud(); eq.classList.add("good"); tone(880+Math.min(right,12)*30,.12,"triangle");
      if(btn) btn.classList.add("good");
      timers.push(setTimeout(()=>alive&&!over&&next(),450));
    } else {
      wrong++; hud(); eq.classList.add("bad"); tone(170,.3,"sawtooth",.1);
      if(btn){ btn.classList.add("bad"); const ok=[...document.querySelectorAll(".mt-choice")].find(x=>+x.dataset.v===q.ans); if(ok) ok.classList.add("good"); }
      fb.className="mt-fb show"; fb.textContent=`${t("mtAnswer")}: ${num(q.ans)}`;
      if(c.mode==="s"){ timers.push(setTimeout(()=>alive&&end(t("mtLost")),1300)); return; }
      timers.push(setTimeout(()=>alive&&!over&&next(),1400));
    }
  }
  function press(k){
    if(busy||over) return;
    if(k==="del"){ entry=entry.slice(0,-1); showEq(); return; }
    if(k==="ok"){ if(entry!=="") answer(+entry); return; }
    if(entry.length>=4) return;
    entry=(entry==="0"?"":entry)+k; tone(600,.04,"triangle",.08); showEq();
  }
  if(!choices) document.querySelectorAll("[data-mk]").forEach(x=>x.onclick=()=>press(x.dataset.mk));
  function end(why){
    if(over) return; over=true; clearInterval(tick); timers.forEach(clearTimeout);
    // Stars: the harder the level, the fewer right answers each star needs (max 5).
    const per = c.mode==="t" ? {e:6,m:5,h:4}[c.lvl] : c.mode==="s" ? {e:5,m:4,h:3}[c.lvl] : {e:10,m:8,h:6}[c.lvl];
    const s = Math.min(c.mode==="p"?3:5, Math.floor(right/per));
    const line = `${mtModeName(c.mode)} · ${mtLvlName(c.lvl)} · ✅ ${num(right)}${c.mode!=="t"?` · ${t("duration")}: ${mmss(sec)}`:""}`;
    setTimeout(()=>{ if(!alive) return; mtAgain=true;
      reward(c.mode==="p"?"mt_p":c.key, right, (v,p)=>c.mode!=="p"&&v>p, s, (why?why+"<br>":"")+line); }, c.mode==="p"?0:500);
  }
  if(c.mode==="p") $("#mtEnd").onclick=()=>end("");
  hud(); next();
  tick=setInterval(()=>{ sec++; hud(); if(c.mode==="t" && sec>=LIMIT) end(t("timeUp")); },1000);
}

function openCanvas(mode,page=null,topic=null){
  drLeave(); $("#back").onclick=drawMenu;
  let tool="brush", color=mode==="color"?"#ff5fa8":"#1b1b1b", size=1, sticker="⭐", locked=false, left=DR_TIME, tick=null;
  const ops=[]; let curOp=null, pid=null;
  const title = topic ? topic[lang] : page ? `${page.ico} ${page[lang]}` : "";
  const toolBtn=(id,ico,label)=>`<button class="dr-tool${tool===id?" on":""}" data-tool="${id}" aria-label="${label}" title="${label}">${ico}</button>`;
  $("#stage").innerHTML=`<div class="dr-wrap">
    ${title?`<div class="dr-topic">${topic?"✏️ "+t("drDrawThis")+": ":""}<b>${esc(title)}</b></div>`:""}
    <div class="dr-bar" id="bar"></div>
    <div class="dr-pal" id="pal"></div>
    <div class="dr-board" id="board"><canvas id="paint" width="${DR_W}" height="${DR_H}"></canvas>${page?`<canvas id="lines" width="${DR_W}" height="${DR_H}"></canvas>`:""}<div class="dr-lock" id="lock" hidden>⏰ ${t("timeUp")}<small>${t("drSaveNow")}</small></div></div>
  </div>`;
  const paint=$("#paint"), pc=paint.getContext("2d",{willReadFrequently:true});
  let lineMask=null, linesCv=null;
  if(page){ linesCv=$("#lines"); const lc=linesCv.getContext("2d",{willReadFrequently:true}); drawPage(lc,page);
    const d=lc.getImageData(0,0,DR_W,DR_H).data; lineMask=new Uint8Array(DR_W*DR_H); for(let i=0;i<lineMask.length;i++) lineMask[i]=d[i*4+3]>110?1:0; }
  const bar=()=>{ $("#bar").innerHTML=`<div class="dr-group">${toolBtn("brush","🖌️",t("drBrush"))}${toolBtn("eraser","🧽",t("drEraser"))}${toolBtn("fill","🪣",t("drFill"))}${toolBtn("sticker","😀",t("drSticker"))}</div>
      <div class="dr-group">${DR_SIZES.map((s,i)=>`<button class="dr-size${size===i?" on":""}" data-size="${i}" aria-label="${i+1}"><i style="width:${8+i*8}px;height:${8+i*8}px"></i></button>`).join("")}</div>
      <div class="dr-group"><button class="dr-tool" id="undo" aria-label="${t("drUndo")}" title="${t("drUndo")}">↩️</button><button class="dr-tool" id="clear" aria-label="${t("drClear")}" title="${t("drClear")}">🗑️</button><button class="dr-save" id="save">💾 ${t("save")}</button></div>`;
    document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{ tool=b.dataset.tool; bar(); pal(); });
    document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{ size=+b.dataset.size; bar(); });
    $("#undo").onclick=()=>{ if(locked||!ops.length) return; ops.pop(); replay(); };
    twoTap($("#clear"),()=>{ if(locked) return; ops.length=0; replay(); bar(); });
    $("#save").onclick=save; };
  const pal=()=>{ $("#pal").innerHTML = tool==="sticker"
      ? DR_STICKERS.map(s=>`<button class="dr-stk${s===sticker?" on":""}" data-stk="${s}">${s}</button>`).join("")
      : DR_COLORS.map(c=>`<button class="dr-col${c===color?" on":""}" data-col="${c}" style="background:${c}" aria-label="${c}"></button>`).join("");
    document.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{ color=b.dataset.col; if(tool==="eraser") tool="brush"; bar(); pal(); });
    document.querySelectorAll("[data-stk]").forEach(b=>b.onclick=()=>{ sticker=b.dataset.stk; pal(); }); };
  bar(); pal();

  function strokeOp(c,op,from=0){
    c.save(); c.globalCompositeOperation=op.e?"destination-out":"source-over";
    c.strokeStyle=op.c; c.fillStyle=op.c; c.lineWidth=op.s; c.lineCap="round"; c.lineJoin="round";
    const p=op.p;
    if(p.length===1){ c.beginPath(); c.arc(p[0][0],p[0][1],op.s/2,0,Math.PI*2); c.fill(); }
    else { c.beginPath(); c.moveTo(p[Math.max(0,from-1)][0],p[Math.max(0,from-1)][1]); for(let i=Math.max(1,from);i<p.length;i++) c.lineTo(p[i][0],p[i][1]); c.stroke(); }
    c.restore();
  }
  function fillOp(op){
    const img=pc.getImageData(0,0,DR_W,DR_H), d=img.data, W=DR_W, H=DR_H;
    const x0=Math.max(0,Math.min(W-1,Math.round(op.x))), y0=Math.max(0,Math.min(H-1,Math.round(op.y)));
    const r=parseInt(op.c.slice(1,3),16), g=parseInt(op.c.slice(3,5),16), bl=parseInt(op.c.slice(5,7),16);
    const px=i=>{ const a=d[i*4+3]; return a<20?[255,255,255]:[d[i*4],d[i*4+1],d[i*4+2]]; };
    const start=px(y0*W+x0);
    const inside = lineMask ? (i=>!lineMask[i]) : (i=>{ const q=px(i); return Math.abs(q[0]-start[0])+Math.abs(q[1]-start[1])+Math.abs(q[2]-start[2])<60; });
    if(!inside(y0*W+x0)) return;
    const seen=new Uint8Array(W*H), stack=[x0,y0];
    while(stack.length){
      const y=stack.pop(); let x=stack.pop();
      let i=y*W+x; while(x>0 && !seen[i-1] && inside(i-1)){ x--; i--; }
      let up=false, down=false;
      for(; x<W && !seen[i] && inside(i); x++, i++){
        seen[i]=1; d[i*4]=r; d[i*4+1]=g; d[i*4+2]=bl; d[i*4+3]=255;
        if(y>0){ const u=i-W; if(!seen[u]&&inside(u)){ if(!up){ stack.push(x,y-1); up=true; } } else up=false; }
        if(y<H-1){ const v=i+W; if(!seen[v]&&inside(v)){ if(!down){ stack.push(x,y+1); down=true; } } else down=false; }
      }
    }
    pc.putImageData(img,0,0);
  }
  function stickerOp(c,op){ c.save(); c.font=`${op.s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; c.textAlign="center"; c.textBaseline="middle"; c.fillText(op.t,op.x,op.y); c.restore(); }
  function run(op){ if(op.type==="stroke") strokeOp(pc,op); else if(op.type==="fill") fillOp(op); else stickerOp(pc,op); }
  function replay(){ pc.clearRect(0,0,DR_W,DR_H); ops.forEach(run); }

  const pos=e=>{ const r=paint.getBoundingClientRect(); return [ (e.clientX-r.left)*DR_W/r.width, (e.clientY-r.top)*DR_H/r.height ]; };
  paint.onpointerdown=e=>{
    if(locked||pid!==null) return; e.preventDefault(); const [x,y]=pos(e);
    if(tool==="fill"){ const op={type:"fill",x,y,c:color}; ops.push(op); fillOp(op); tone(520,.08,"triangle"); return; }
    if(tool==="sticker"){ const op={type:"sticker",t:sticker,x,y,s:DR_STK[size]}; ops.push(op); stickerOp(pc,op); tone(880,.08,"triangle"); return; }
    pid=e.pointerId; try{ paint.setPointerCapture(pid); }catch(err){}
    curOp={type:"stroke",c:color,s:tool==="eraser"?DR_SIZES[size]*2:DR_SIZES[size],e:tool==="eraser",p:[[x,y]]};
    strokeOp(pc,curOp);
  };
  paint.onpointermove=e=>{
    if(e.pointerId!==pid||!curOp) return; e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; const from=curOp.p.length;
    (evs.length?evs:[e]).forEach(ev=>{ const q=pos(ev), l=curOp.p[curOp.p.length-1]; if(Math.abs(q[0]-l[0])+Math.abs(q[1]-l[1])>1.5) curOp.p.push(q); });
    if(curOp.p.length>from) strokeOp(pc,curOp,from);
  };
  const up=e=>{ if(e.pointerId!==pid) return; pid=null; if(curOp){ ops.push(curOp); curOp=null; } };
  paint.onpointerup=up; paint.onpointercancel=up;

  function save(){
    const k=cur();
    if(ops.length<3){ toast(t("drTooLittle")); return; }
    if(!k||isGuest()){ toast(t("drGuestNote")); return; }
    if(!F){ toast(t("drNoNet")); return; }
    const out=document.createElement("canvas"); out.width=800; out.height=600; const oc=out.getContext("2d");
    oc.fillStyle="#fff"; oc.fillRect(0,0,800,600); oc.drawImage(paint,0,0,800,600); if(linesCv) oc.drawImage(linesCv,0,0,800,600);
    let img=out.toDataURL("image/jpeg",.72); if(img.length>600000) img=out.toDataURL("image/jpeg",.5);
    F.setDoc(F.doc(F.collection(F.db,"drawings")),{kid:k.id,at:F.serverTimestamp(),mode,img,topic:String(title).slice(0,60)})
      .catch(e=>{ console.warn(e); toast(t("drSaveErr")); });
    // One star per saved drawing, up to DR_DAILY a day.
    const n=drCountToday(k), star=n<DR_DAILY?1:0;
    k.best=k.best||{}; k.best.drawDay=drToday()+":"+(n+1); k.stars=(k.stars||0)+star;
    cacheKids(); cloudReward(k,star,"drawDay",k.best.drawDay,true); refreshStars();
    if(star) chime(); else tone(660,.15,"triangle");
    $("#layer").innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">
      <h2>${t("drSaved")}</h2>
      <img class="dr-prev" src="${img}" alt="">
      <div style="font-size:1.3rem;font-weight:800">${star?`⭐ ${t("got")(num(1))}`:t("drLimit")(num(DR_DAILY))}</div>
      <div class="row"><button class="big" id="drNew">${t("drNew")}</button><button class="ghost soft" id="drGal">🖼️ ${t("drGallery")}</button><button class="ghost soft" id="toHub">${t("home")}</button></div>
    </div></div>`;
    $("#drNew").onclick=()=>{ $("#layer").innerHTML=""; if(mode==="challenge") openCanvas("challenge",null,randomTopic()); else if(mode==="color") pickPage(); else openCanvas("free"); };
    $("#drGal").onclick=()=>{ $("#layer").innerHTML=""; openGallery(); };
    $("#toHub").onclick=()=>{ $("#layer").innerHTML=""; go("hub"); };
  }

  if(mode==="challenge"){
    const hud=()=>$("#hud").innerHTML=`<span class="pill">⏱ ${mmss(left)}</span>`; hud();
    tick=setInterval(()=>{ left--; hud(); if(left<=0){ clearInterval(tick); locked=true; $("#lock").hidden=false; tone(330,.4,"triangle"); } },1000);
  } else $("#hud").innerHTML="";
  cleanup=()=>{ clearInterval(tick); };
}

}

// ================= password keypad =================
const PIN_LEN = 4;
// mode "enter": check the girl's password. mode "new": choose one, type it twice, save it.
function openPin(kid, mode, onDone){
  let entry="", first=null, busy=false;
  const title = () => mode==="enter" ? t("pinEnter") : first==null ? t("pinNew") : t("pinAgain");
  const keys = ["1","2","3","4","5","6","7","8","9","x","0","del"];
  $("#layer").innerHTML=`<div class="overlay" id="pinOv"><div class="sheet pin-sheet" role="dialog" aria-modal="true">
    <div class="pin-face" style="background:${kid.color}" aria-hidden="true">${esc(kid.avatar)}</div>
    <div class="pin-name">${esc(kidName(kid))}</div>
    <div class="pin-title" id="pinTitle">${title()}</div>
    <div class="dots" id="dots" aria-live="polite">${"<i></i>".repeat(PIN_LEN)}</div>
    <div class="pin-msg" id="pinMsg"></div>
    <div class="keypad" dir="ltr">${keys.map(k=>k==="x"?`<button class="key key-x" id="pinX" aria-label="${t("cancel")}">✕</button>`
      :k==="del"?`<button class="key key-x" data-k="del" aria-label="${t("del")}">⌫</button>`
      :`<button class="key" data-k="${k}">${num(k)}</button>`).join("")}</div>
  </div></div>`;
  const dots=[...document.querySelectorAll("#dots i")], msg=$("#pinMsg");
  const paint=()=>dots.forEach((d,i)=>d.classList.toggle("on",i<entry.length));
  const close=()=>{ document.removeEventListener("keydown",onKey); $("#layer").innerHTML=""; };
  const shake=text=>{ msg.textContent=text; tone(180,.3,"sawtooth",.1); const d=$("#dots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake"); };
  async function full(){
    busy=true;
    if(mode==="enter"){
      const h=await hashPin(kid.id,entry);
      if(h===kid.pin){ tone(988,.15,"triangle"); close(); onDone(); return; }
      entry=""; paint(); shake(t("pinWrong"));
    } else if(first==null){
      first=entry; entry=""; paint(); msg.textContent=""; $("#pinTitle").textContent=title();
    } else if(first===entry){
      kid.pin=await hashPin(kid.id,entry); cacheKids(); cloudSet(kid);
      msg.textContent=t("pinSaved"); tone(988,.15,"triangle");
      setTimeout(()=>{ close(); onDone(); },500); return;
    } else {
      first=null; entry=""; paint(); $("#pinTitle").textContent=title(); shake(t("pinMismatch"));
    }
    busy=false;
  }
  function press(k){
    if(busy) return;
    if(k==="del"){ entry=entry.slice(0,-1); paint(); return; }
    if(entry.length>=PIN_LEN) return;
    entry+=k; paint(); tone(600+entry.length*40,.06,"triangle",.12);
    if(entry.length===PIN_LEN) setTimeout(full,150);
  }
  function onKey(e){ if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==="Backspace") press("del"); else if(e.key==="Escape") close(); }
  document.addEventListener("keydown",onKey);
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>press(b.dataset.k));
  $("#pinX").onclick=close;
}

    const name=$("#dn").value.trim().slice(0,40); if(!name) return;
    const btn=$("#reqBtn"), msg=$("#reqMsg");
    if(!F||!uid){ msg.textContent=t("reqErr"); return; }
    btn.disabled=true; btn.textContent=t("sending");
    const code=String(1000+Math.floor(Math.random()*9000));
    try{ await F.setDoc(F.doc(F.db,"requests",uid),{name,code,at:F.serverTimestamp()}); }
    catch(err){ console.warn(err); msg.textContent=t("reqErr"); btn.disabled=false; btn.textContent=t("sendReq"); }
  };
  const c=$("#cancelReq");
  if(c) c.onclick=()=>{ if(F&&uid) F.deleteDoc(F.doc(F.db,"requests",uid)).catch(()=>{}); };
}

function openDeviceSettings(){
  $("#layer").innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">
    <h2>📱 ${t("thisDevice")}</h2>

    <div class="section"><b>🔐 ${t("iAmAdmin")}</b><p class="small">${t("adminLoginNote")}</p>

// ================= admin settings =================
let requests=[], devices=[];
const RULES_TEMPLATE = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function isAdmin() { return signedIn() && request.auth.uid == 'ADMIN_UID'; }
    function isDevice() { return signedIn() && exists(/databases/$(database)/documents/devices/$(request.auth.uid)); }
    function validKid() {
      return request.resource.data.keys().hasOnly(['name', 'avatar', 'color', 'stars', 'best', 'pin'])
        && request.resource.data.name is string && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 20
        && request.resource.data.avatar is string && request.resource.data.avatar.size() <= 16
        && request.resource.data.color is string && request.resource.data.color.size() <= 9
        && request.resource.data.stars is int && request.resource.data.stars >= 0
        && request.resource.data.best is map
        && (!('pin' in request.resource.data)
            || (request.resource.data.pin is string && request.resource.data.pin.size() == 64));
    }

    // The girls: the admin and approved devices can see them all.
    // Devices can play and set passwords, but only the admin adds, renames or deletes a girl.
    match /kids/{kidId} {
      allow read: if isAdmin() || isDevice();
      allow create: if isAdmin() && validKid();
      allow update: if validKid() && (isAdmin() || (isDevice() && request.resource.data.name == resource.data.name));
      allow delete: if isAdmin();
    }

    // Approved devices: only the admin approves or removes them.
    match /devices/{deviceId} {
      allow read: if isAdmin() || (signedIn() && request.auth.uid == deviceId);
      allow create, update: if isAdmin()
        && request.resource.data.keys().hasOnly(['name', 'at'])
        && request.resource.data.name is string && request.resource.data.name.size() <= 40;
      allow delete: if isAdmin();
    }

    // Requests: a new device can only write its own request.
    match /requests/{deviceId} {
      allow read: if isAdmin() || (signedIn() && request.auth.uid == deviceId);
      allow create: if signedIn() && request.auth.uid == deviceId
        && request.resource.data.keys().hasOnly(['name', 'code', 'at'])
        && request.resource.data.name is string && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 40
        && request.resource.data.code is string && request.resource.data.code.size() == 4
        && request.resource.data.at == request.time;
      allow delete: if isAdmin() || (signedIn() && request.auth.uid == deviceId);
    }

    // Drawings gallery: approved devices add drawings and everyone sees them; only the admin deletes.
    match /drawings/{drawingId} {
      allow read: if isAdmin() || isDevice();
      allow create: if (isAdmin() || isDevice())
        && request.resource.data.keys().hasOnly(['kid', 'at', 'mode', 'img', 'topic'])
        && request.resource.data.kid is string && request.resource.data.kid.size() <= 40
        && request.resource.data.mode in ['free', 'color', 'challenge']
        && request.resource.data.img is string && request.resource.data.img.size() < 700000
        && request.resource.data.topic is string && request.resource.data.topic.size() <= 60
        && request.resource.data.at == request.time;
      allow delete: if isAdmin();
    }

    // Older setup, kept only so the admin's earlier data can be moved over.
    match /users/{userId}/kids/{kidId} {
      allow read, delete: if signedIn() && request.auth.uid == userId;
    }
  }
}`;
function twoTap(btn, onConfirm){
  btn.onclick=()=>{ if(!btn.dataset.armed){ btn.dataset.armed="1"; btn.textContent=t("tapAgain"); return; } onConfirm(); };
}
function openSettings(){
  const rulesText = RULES_TEMPLATE.replace("ADMIN_UID", uid||"");
  const draw=()=>{
    $("#layer").innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">
    <h2>⚙️ ${t("settings")}</h2>
    <p class="small">${sync==="on"?"🟢 "+t("syncOn"):sync==="nonet"?"📡 "+t("syncNoNet"):sync==="off"?"⚠️ "+t("syncErr"):"⏳ "+t("syncWait")}</p>

    <div class="section"><b>📨 ${t("reqs")}</b>
      ${requests.length ? requests.map(r=>`<div class="pinrow"><span>${esc(r.name)} <span class="small" dir="ltr">(${String(r.code).split("").map(num).join("")})</span></span>
        <span class="row" style="gap:6px"><button class="ghost soft mini ok" data-approve="${esc(r.id)}">✅ ${t("approve")}</button><button class="ghost soft mini" data-reject="${esc(r.id)}">${t("reject")}</button></span></div>`).join("")
        : `<p class="small">${t("noReqs")}</p>`}</div>

    <div class="section"><b>📱 ${t("devices")}</b>
      ${devices.length ? devices.map(d=>`<div class="pinrow"><span>${esc(d.name)}</span><button class="ghost soft mini" data-revoke="${esc(d.id)}">${t("revoke")}</button></div>`).join("")
        : `<p class="small">${t("noDevices")}</p>`}</div>

    <div class="section"><b>👧 ${t("girls")}</b>
      ${kids.map(k=>`<div class="pinrow"><span>${esc(k.avatar)} ${esc(kidName(k))} <span class="small">⭐ ${num(k.stars||0)}</span></span><button class="ghost soft mini" data-editkid="${esc(k.id)}">✏️ ${t("edit")}</button></div>`).join("")}
      <button class="ghost soft" id="addGirl">＋ ${t("addGirl")}</button></div>

    <div class="section"><b>🔒 ${t("pins")}</b><p class="small">${t("pinResetNote")}</p>
      ${kids.map(k=>`<div class="pinrow"><span>${esc(k.avatar)} ${esc(kidName(k))}</span>${k.pin
        ?`<button class="ghost soft mini" data-reset="${esc(k.id)}">${t("pinReset")}</button>`
        :`<span class="small">${t("pinNone")}</span>`}</div>`).join("")}</div>

    <div class="section"><b>🛡️ ${t("rules")}</b><p class="small">${t("rulesNote")}</p>
      <textarea id="rulesBox" readonly dir="ltr">${esc(rulesText)}</textarea>
      <button class="ghost soft" id="copyRules">${t("copyRules")}</button></div>

    <div class="section"><b>👤 ${t("account")}</b>
      <p class="small">${t("signedAs")}: <span dir="ltr">${esc(A&&A.auth.currentUser?A.auth.currentUser.email:"")}</span></p>
      <button class="danger" id="logout">${t("logout")}</button></div>
    <button class="big" id="closeS">${t("close")}</button>
  </div></div>`;
    document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=async()=>{
      const r=requests.find(x=>x.id===b.dataset.approve); if(!r||!F) return;
      b.disabled=true;
      try{ await F.setDoc(F.doc(F.db,"devices",r.id),{name:r.name,at:F.serverTimestamp()}); await F.deleteDoc(F.doc(F.db,"requests",r.id)); }
      catch(e){ onCloudError(e); b.disabled=false; }
    });
    document.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>{ if(F) F.deleteDoc(F.doc(F.db,"requests",b.dataset.reject)).catch(onCloudError); });
    document.querySelectorAll("[data-revoke]").forEach(b=>twoTap(b,()=>{ if(F) F.deleteDoc(F.doc(F.db,"devices",b.dataset.revoke)).catch(onCloudError); }));
    document.querySelectorAll("[data-editkid]").forEach(b=>b.onclick=()=>openEditor(b.dataset.editkid));
    $("#addGirl").onclick=()=>openEditor(null);
    document.querySelectorAll("[data-reset]").forEach(b=>twoTap(b,()=>{
      const k=kids.find(x=>x.id===b.dataset.reset); if(!k) return;
      delete k.pin; cacheKids(); cloudSet(k); draw();
    }));
    $("#copyRules").onclick=async e=>{
      const b=e.currentTarget;
      try{ await navigator.clipboard.writeText(rulesText); b.textContent=t("copied"); }
      catch(err){ const box=$("#rulesBox"); box.focus(); box.select(); }
    };
    twoTap($("#logout"),()=>{ $("#layer").innerHTML=""; setRole(null); kids=[]; cacheKids(); if(A) A.signOut(A.auth); });
    $("#closeS").onclick=()=>{ settingsRedraw=null; $("#layer").innerHTML=""; render(); };
  };
  settingsRedraw=draw;
  draw();
}
let settingsRedraw=null;   // live-refresh the admin panel when requests or devices change
const refreshSettings=()=>{ if(settingsRedraw && $("#closeS") && $("#rulesBox")) settingsRedraw(); };

// ================= cloud sync =================
let unsubs=[], seeded=false, A=null;
const stopAll=()=>{ unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[]; };
const sortKids=list=>list.sort((a,b)=>a.id.localeCompare(b.id));

function listenKids(isAdmin){
  seeded=false; setSync("wait");
  unsubs.push(F.onSnapshot(F.collection(F.db,"kids"),{includeMetadataChanges:true}, async snap=>{
    const fromServer=!snap.metadata.fromCache;
    if(fromServer) setSync("on");
    if(snap.empty){
      if(!fromServer || !isAdmin || seeded) return;
      // First time on this setup: move the admin's earlier girls over (or start with the default girls).
      seeded=true;
      let start=[];
      try{ const old=await F.getDocs(F.collection(F.db,"users",uid,"kids")); start=old.docs.map(d=>({id:d.id,...d.data()})); }catch(e){}
      if(!start.length) start=kids.length?kids:defaults();
      kids=sortKids(start.map(k=>({...k}))); kids.forEach(cloudSet); cacheKids();
      if(!view.startsWith("g-") && !$("#layer").innerHTML) render();
      return;
    }
    kids=sortKids(snap.docs.map(d=>({id:d.id,...d.data()})));
    cacheKids();
    if(view.startsWith("g-")) refreshStars();
    else if(!$("#layer").innerHTML) render();
    else refreshSettings();
  }, err=>{ onCloudError(err); if(!$("#layer").innerHTML) render(); }));
}
function asAdmin(){
  setRole("admin");
  listenKids(true);
  unsubs.push(F.onSnapshot(F.collection(F.db,"requests"), s=>{ requests=s.docs.map(d=>({id:d.id,...d.data()})); refreshSettings(); }, e=>console.warn(e)));
  unsubs.push(F.onSnapshot(F.collection(F.db,"devices"), s=>{ devices=s.docs.map(d=>({id:d.id,...d.data()})); refreshSettings(); }, e=>console.warn(e)));
  if(view==="login"||view==="pending") go("who");
}
function asDevice(){
  // Watch this device's approval. Approve -> girls appear; removed -> back to the request screen.
  let kidsOn=false, reqUnsub=null;
  unsubs.push(F.onSnapshot(F.doc(F.db,"devices",uid),{includeMetadataChanges:true}, snap=>{
    if(snap.exists()){
      if(reqUnsub){ reqUnsub(); reqUnsub=null; }
      setRole("device");
      if(!kidsOn){ kidsOn=true; listenKids(false); }
      if(view==="pending") go("who");
    } else if(!snap.metadata.fromCache){
      setRole(null); kids=[]; cacheKids(); setSync("off");
      if(!reqUnsub){
        reqUnsub=F.onSnapshot(F.doc(F.db,"requests",uid), r=>{ myRequest=r.exists()?r.data():null; if(view==="pending") render(); }, e=>console.warn(e));
        unsubs.push(()=>reqUnsub&&reqUnsub());
      }
      if(view!=="pending" && view!=="login" && !isGuest()) go("pending");
    }
  }, err=>{ console.warn(err); setSync("off"); }));
}
async function startCloud(){
  try{
    const [{initializeApp},au,fs] = await Promise.all([
      import(FB+"firebase-app.js"), import(FB+"firebase-auth.js"), import(FB+"firebase-firestore.js")
    ]);
    const app = initializeApp(firebaseConfig);
    const auth = au.getAuth(app);
    A = {auth, signIn:au.signInWithEmailAndPassword, signOut:au.signOut, reset:au.sendPasswordResetEmail};
    let db;
    try{ db = fs.initializeFirestore(app,{localCache:fs.persistentLocalCache()}); }
    catch(e){ db = fs.getFirestore(app); }
    F = {db, doc:fs.doc, collection:fs.collection, setDoc:fs.setDoc, updateDoc:fs.updateDoc, deleteDoc:fs.deleteDoc,
         query:fs.query, orderBy:fs.orderBy, limit:fs.limit,
         onSnapshot:fs.onSnapshot, increment:fs.increment, getDocs:fs.getDocs, serverTimestamp:fs.serverTimestamp};
    au.onAuthStateChanged(auth, user=>{
      stopAll(); requests=[]; devices=[]; myRequest=null;
      if(!user){
        // Every device gets its own anonymous identity; the admin decides whether it may see anything.
        uid=null;
        au.signInAnonymously(auth).catch(e=>{ console.warn(e); setSync(navigator.onLine?"off":"nonet"); });
        return;
      }
      uid=user.uid;
      if(user.isAnonymous) asDevice(); else asAdmin();
    });
  }catch(e){
    console.warn("Firebase not loaded", e);
    setSync("nonet"); if(view==="who"||view==="pending") render();
  }
}

// ================= night sky =================
function sky(){
  const c=$("#sky"),x=c.getContext("2d"),dpr=Math.min(2,window.devicePixelRatio||1);
  let pts=[];
  const size=()=>{c.width=innerWidth*dpr;c.height=innerHeight*dpr;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";
    pts=Array.from({length:70},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:(Math.random()*1.6+.4)*dpr,p:Math.random()*6}))};
  size(); addEventListener("resize",size);
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const draw=tm=>{x.clearRect(0,0,c.width,c.height);
    pts.forEach(s=>{x.globalAlpha=still?.7:.35+.45*Math.abs(Math.sin(tm/1400+s.p));x.fillStyle="#fffbe6";x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});
    if(!still) requestAnimationFrame(draw)};
  requestAnimationFrame(draw);
}

// ================= boot =================
sky(); render(); startCloud();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
