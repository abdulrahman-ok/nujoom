<style>
:root{
  --sky-top:#2a1f6b; --sky-bot:#6b3fa0; --ink:#fffaf0; --ink-soft:#d9cff5;
  --star:#ffd23f; --star-deep:#f4a300; --card:#ffffff; --card-ink:#2a1f4f;
  --pink:#ff6fae; --mint:#3ddcb0; --sky:#4cb5ff; --coral:#ff8a5c;
  --font:"Baloo Bhaijaan 2","Geeza Pro","Arial Rounded MT Bold",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:var(--ink);
  background:linear-gradient(180deg,var(--sky-top),var(--sky-bot)) fixed;
  background-color:var(--sky-top);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font-family:inherit;cursor:pointer;border:0}
button:focus-visible{outline:4px solid var(--star);outline-offset:3px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.6rem}
.brand .logo{width:44px;height:44px}
.bar-actions{display:flex;gap:8px;align-items:center}
.pill{background:rgba(255,255,255,.14);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:1.05rem;font-weight:700;display:inline-flex;align-items:center;gap:8px}
button.pill:hover{background:rgba(255,255,255,.24)}
.starcount{background:var(--star);color:var(--card-ink);font-variant-numeric:tabular-nums}
.sync{font-size:.9rem;padding:6px 12px}
.sync i{width:10px;height:10px;border-radius:50%;background:#9a8fc4;display:inline-block}
.sync.on i{background:var(--mint)} .sync.off i{background:var(--coral)}

h1,h2{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800}
h2{font-size:1.4rem;font-weight:800}
.sub{color:var(--ink-soft);font-size:1.15rem;margin:4px 0 0}

.bar-who{justify-content:flex-end}
.hero{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px}
.hero-title{font-size:clamp(3rem,10vw,4.6rem);font-weight:800;line-height:1.1;color:var(--star);text-shadow:0 4px 0 rgba(0,0,0,.18)}
.hero-stars{display:flex;gap:14px;font-size:clamp(1.8rem,5vw,2.4rem)}
.hero-stars span{display:inline-block;animation:twinkle 2.4s ease-in-out infinite}
.hero-stars span:nth-child(2){animation-delay:.4s;transform:translateY(-6px)}
.hero-stars span:nth-child(3){animation-delay:.8s}
@keyframes twinkle{50%{opacity:.55;scale:.85}}
.center{text-align:center}
.center .sub{margin-top:6px}

.kids{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%;max-width:800px;margin:8px auto 0}
@media (max-width:600px){.kids{grid-template-columns:repeat(2,minmax(0,1fr));max-width:420px}}
.kid{position:relative;background:var(--card);color:var(--card-ink);border-radius:24px;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;
  box-shadow:0 6px 0 var(--shade,#c9b8f0);transition:transform .15s;cursor:pointer}
.kid:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shade,#c9b8f0)}
.kid .face{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:44px;background:var(--c)}
.kid .name{font-size:1.35rem;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kid .stars{font-size:1.05rem;font-weight:700;color:#8a5a00;font-variant-numeric:tabular-nums}
.kid .edit{position:absolute;top:8px;inset-inline-end:8px;width:32px;height:32px;border-radius:50%;background:#f1ecff;color:var(--card-ink);font-size:.9rem;padding:0}
.crown{position:absolute;top:-16px;font-size:28px}

.hello{display:flex;align-items:center;gap:14px}
.hello .face{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:var(--c);flex:none}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.game{border-radius:28px;padding:20px;color:var(--card-ink);text-align:start;display:flex;flex-direction:column;gap:6px;min-height:170px;position:relative;overflow:hidden;
  box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .15s}
.game:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.game .ico{font-size:52px;line-height:1}
.game .t{font-size:1.5rem;font-weight:800}
.game .d{font-size:1.05rem;opacity:.8}
.game .best{margin-top:auto;font-size:.95rem;font-weight:700;background:rgba(255,255,255,.55);align-self:flex-start;padding:3px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.g-mem{background:#ffd9ec}.g-sim{background:#c9f5e7}.g-tap{background:#fff1b8}
.soon{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.locked{border-radius:24px;padding:16px 18px;border:2px dashed rgba(255,255,255,.35);display:flex;gap:12px;align-items:center;color:var(--ink-soft)}
.locked .ico{font-size:34px}
.locked b{color:var(--ink);font-size:1.15rem;display:block}

.gamehead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.stage{background:rgba(255,255,255,.1);border-radius:28px;padding:16px;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;overflow:hidden}

.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:560px}
.card{aspect-ratio:1;max-width:100%;border-radius:20px;perspective:600px;background:none;padding:0}
.card .in{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .b{background:var(--star);box-shadow:inset 0 -6px 0 var(--star-deep);font-size:clamp(28px,6vw,44px);color:var(--card-ink)}
.card .f{background:var(--card);transform:rotateY(180deg);font-size:clamp(34px,8vw,58px)}
.card.done .f{background:#d8ffe9}

.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(420px,100%)}
.pad{aspect-ratio:1;border-radius:32px;opacity:.55;transition:opacity .1s,transform .1s;box-shadow:inset 0 -8px 0 rgba(0,0,0,.2)}
.pad.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 40px currentColor,inset 0 -8px 0 rgba(0,0,0,.2)}
.pad[data-i="0"]{background:var(--pink);color:var(--pink)}
.pad[data-i="1"]{background:var(--mint);color:var(--mint)}
.pad[data-i="2"]{background:var(--sky);color:var(--sky)}
.pad[data-i="3"]{background:var(--coral);color:var(--coral)}
.simon.wait .pad{pointer-events:none}
.msg{font-size:1.5rem;font-weight:800;text-align:center;min-height:2.2em}

.arena{position:relative;width:100%;height:60vh;min-height:320px;touch-action:manipulation}
.target{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;background:none;font-size:60px;line-height:76px;padding:0;animation:pop .25s ease-out}
.target.gone{animation:vanish .25s forwards;pointer-events:none}
.plus{position:absolute;font-weight:800;font-size:1.6rem;color:var(--star);pointer-events:none;animation:rise .7s forwards}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes vanish{to{transform:scale(1.8);opacity:0}}
@keyframes rise{to{transform:translateY(-50px);opacity:0}}

.big{background:var(--star);color:var(--card-ink);font-size:1.5rem;font-weight:800;border-radius:999px;padding:12px 34px;box-shadow:0 6px 0 var(--star-deep)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 var(--star-deep)}
.ghost{background:rgba(255,255,255,.16);color:var(--ink);font-size:1.2rem;font-weight:700;border-radius:999px;padding:10px 24px}
.soft{background:#f1ecff;color:var(--card-ink)}

.overlay{position:fixed;inset:0;background:rgba(20,10,50,.6);display:grid;place-items:center;z-index:20;padding:20px;overflow-y:auto}
.sheet{background:var(--card);color:var(--card-ink);border-radius:32px;padding:26px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;animation:pop .3s}
.sheet h2{font-size:1.8rem}
.won{font-size:56px;letter-spacing:4px}
.won span{display:inline-block;animation:pop .4s backwards}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sheet input{font-family:inherit;font-size:1.4rem;padding:10px 16px;border-radius:16px;border:3px solid #e2dbff;width:100%;text-align:center;color:var(--card-ink);background:#fff;user-select:text;-webkit-user-select:text}
.sheet input:focus{outline:none;border-color:var(--sky-bot)}
.pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pick button{width:52px;height:52px;border-radius:50%;font-size:30px;background:#f3efff;border:3px solid transparent}
.pick button[aria-pressed="true"]{border-color:var(--sky-bot)}
.pick.colors button{font-size:0}
.danger{background:none;color:#c0396b;font-weight:700;font-size:1rem;text-decoration:underline}
.note{font-size:.95rem;color:var(--ink-soft);text-align:center;margin:0}
.guest-btn{background:rgba(255,255,255,.12);color:var(--ink);border:2px dashed rgba(255,255,255,.45);border-radius:999px;padding:8px 22px;font-size:1.1rem;font-weight:700}
.guest-btn:active{transform:translateY(2px)}
.pin-sheet{gap:10px;width:min(360px,100%)}
.pin-face{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:42px}
.pin-name{font-size:1.5rem;font-weight:800;line-height:1}
.pin-title{font-size:1.15rem;font-weight:700;color:#5a4f80}
.dots{display:flex;gap:12px;direction:ltr;padding:6px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid #c5b6f5;display:block;transition:background .1s}
.dots i.on{background:var(--sky-bot);border-color:var(--sky-bot)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-msg{min-height:1.4em;font-weight:700;color:#c0396b;font-size:1rem}
.keypad{display:grid;grid-template-columns:repeat(3,68px);gap:12px;justify-content:center}
.key{width:68px;height:68px;border-radius:50%;background:#f1ecff;color:var(--card-ink);font-size:1.8rem;font-weight:800;box-shadow:0 4px 0 #ddd3ff}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #ddd3ff}
.key-x{background:none;box-shadow:none;font-size:1.5rem;color:#7a6fa3}
.pinrow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:1.1rem}
.code{font-family:ui-monospace,Menlo,monospace;font-size:1.25rem;letter-spacing:.06em;background:#f3efff;border-radius:14px;padding:10px 14px;direction:ltr;user-select:all;-webkit-user-select:all;word-break:break-all}
.small{font-size:.95rem;color:#5a4f80;margin:0}
.section{width:100%;display:flex;flex-direction:column;gap:8px;align-items:center;padding-top:10px;border-top:2px solid #f1ecff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.mem{gap:8px}.kids{gap:10px}.kid .face{width:58px;height:58px;font-size:34px}.kid .name{font-size:1.1rem}}
</style>
</head>

// The three girls always exist. A missing profile is added; an empty name is filled in.
// Names, pictures and colors changed in the app are kept.
function ensureRoster(list){
  const out = (list||[]).map(k=>({...k})), fixes = [];
  for(const d of defaults()){
    const k = out.find(x=>x.id===d.id);
    if(!k){ out.push(d); fixes.push(d); }
    else if(!String(k.name||"").trim()){ k.name=d.name; fixes.push(k); }
  }
  out.sort((a,b)=>a.id.localeCompare(b.id));
  return {list:out, fixes};
}

async function hashPin(id,pin){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(fam+":"+id+":"+pin));
  return Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,"0")).join("");
}

let ac=null;
function tone(freq,dur=.15,type="sine",vol=.18){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=vol;
    o.connect(g);g.connect(ac.destination);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
    o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}

// ================= reward =================
function reward(game, value, better, stars, line){
  const k = cur(); if(!k) return;
  k.best = k.best||{};
  const prev = k.best[game];
  const isBest = prev==null || better(value,prev);
  if(isBest) k.best[game]=value;
  k.stars = (k.stars||0)+stars;
  if(!isGuest()){ cacheKids(); cloudReward(k,stars,game,value,isBest); }
  refreshStars();
  chime();
  const starsHtml = Array.from({length:stars},(_,i)=>`<span style="animation-delay:${i*.12}s">⭐</span>`).join("");
  $("#layer").innerHTML = `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">
    <h2>${t("win")}</h2>
    <div class="won" aria-hidden="true">${starsHtml}</div>
    <div style="font-size:1.4rem;font-weight:800">${t("got")(num(stars))}</div>
    <div style="font-size:1.1rem">${line}</div>
    ${isBest && prev!=null ? `<div style="font-size:1.2rem;font-weight:800;color:#c05a00">${t("newBest")}</div>`:""}
    <div class="row"><button class="big" id="again">${t("again")}</button><button class="ghost soft" id="toHub">${t("home")}</button></div>
  </div></div>`;
  $("#again").onclick=()=>{ $("#layer").innerHTML=""; go(view); };
  $("#toHub").onclick=()=>{ $("#layer").innerHTML=""; go("hub"); };
}

function startSimon(){
  bindBack();
  const notes=[523,659,784,988];
  let seq=[],pos=0,timers=[],alive=true;
  cleanup=()=>{alive=false;timers.forEach(clearTimeout)};
  const hud=()=>$("#hud").innerHTML=`<span class="pill">${t("level")}: ${num(Math.max(seq.length,1))}</span>`;
  $("#stage").innerHTML=`<div class="msg" id="msg">${t("simD")}</div>
    <div class="simon wait" id="simon">${[0,1,2,3].map(i=>`<button class="pad" data-i="${i}" aria-label="${i+1}"></button>`).join("")}</div>
    <button class="big" id="go">${t("start")}</button>`;
  hud();
  const pads=[...document.querySelectorAll(".pad")], board=$("#simon"), msg=$("#msg");
  const flash=(i,d=380)=>{pads[i].classList.add("lit");tone(notes[i],d/1000,"sine",.22);timers.push(setTimeout(()=>pads[i].classList.remove("lit"),d))};
  function next(){
    seq.push(Math.floor(Math.random()*4)); pos=0; hud();
    board.classList.add("wait"); msg.textContent=t("watch");
    const gap=Math.max(320,650-seq.length*25);
    seq.forEach((p,i)=>timers.push(setTimeout(()=>alive&&flash(p,gap*.65),600+i*gap)));
    timers.push(setTimeout(()=>{if(!alive)return;board.classList.remove("wait");msg.textContent=t("yourTurn")},600+seq.length*gap));
  }
  pads.forEach(p=>p.onclick=()=>{
    const i=+p.dataset.i; flash(i,220);
    if(i!==seq[pos]){
      board.classList.add("wait"); msg.textContent=t("oops"); tone(180,.4,"sawtooth",.12);
      const lvl=seq.length-1;
      if(lvl<1){ timers.push(setTimeout(()=>alive&&go("g-sim"),1200)); return; }
      const s=Math.min(5,Math.max(1,Math.ceil(lvl/2)));
      timers.push(setTimeout(()=>alive&&reward("sim",lvl,(v,p)=>v>p,s,`${t("level")}: ${num(lvl)}`),900));
      return;
    }
    pos++;
    if(pos===seq.length){ board.classList.add("wait"); timers.push(setTimeout(()=>alive&&next(),700)); }
  });
  $("#go").onclick=e=>{e.currentTarget.hidden=true;next()};
}

function startTap(){
  bindBack();
  let score=0,left=30,timers=[],tick=null,alive=true;
  cleanup=()=>{alive=false;timers.forEach(clearTimeout);clearInterval(tick)};
  const hud=()=>$("#hud").innerHTML=`<span class="pill">${t("score")}: ${num(score)}</span><span class="pill">⏱ ${num(left)}</span>`;
  hud();
  $("#stage").innerHTML=`<div class="arena" id="arena"><div style="position:absolute;inset:0;display:grid;place-items:center"><button class="big" id="go">${t("start")}</button></div></div>`;
  const arena=$("#arena");
  function spawn(){
    if(!alive||left<=0) return;
    const comet=Math.random()<.12;
    const b=document.createElement("button");
    b.className="target"; b.textContent=comet?"☄️":"⭐"; b.setAttribute("aria-label",comet?"+3":"+1");
    b.style.left=(10+Math.random()*80)+"%"; b.style.top=(12+Math.random()*76)+"%";
    const life=comet?900:Math.max(800,1500-(30-left)*20);
    b.onpointerdown=e=>{
      e.preventDefault(); if(b.classList.contains("gone")) return;
      const add=comet?3:1; score+=add; hud(); tone(comet?1320:880+Math.random()*200,.1,"triangle");
      b.classList.add("gone");
      const p=document.createElement("span"); p.className="plus"; p.textContent="+"+add; p.style.left=b.style.left; p.style.top=b.style.top; arena.appendChild(p);
      timers.push(setTimeout(()=>{b.remove();p.remove()},700));
    };
    arena.appendChild(b);
    timers.push(setTimeout(()=>{if(!b.classList.contains("gone")){b.classList.add("gone");timers.push(setTimeout(()=>b.remove(),300))}},life));
    timers.push(setTimeout(spawn,Math.max(350,750-(30-left)*12)));
  }
  $("#go").onclick=()=>{
    arena.innerHTML=""; spawn(); spawn();
    tick=setInterval(()=>{left--;hud();if(left<=0){clearInterval(tick);
      timers.push(setTimeout(()=>{ if(!alive) return; arena.innerHTML="";
        const s=Math.min(5,Math.max(1,Math.floor(score/10)));
        reward("tap",score,(v,p)=>v>p,s,`${t("score")}: ${num(score)}`);
      },400));
    }},1000);
  };
}

      :k==="del"?`<button class="key key-x" data-k="del" aria-label="${t("del")}">⌫</button>`

  const dots=[...document.querySelectorAll("#dots i")], msg=$("#pinMsg");
  const paint=()=>dots.forEach((d,i)=>d.classList.toggle("on",i<entry.length));
  const close=()=>{ document.removeEventListener("keydown",onKey); $("#layer").innerHTML=""; };
  const shake=text=>{ msg.textContent=text; tone(180,.3,"sawtooth",.1); const d=$("#dots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake"); };
  async function full(){
    busy=true;
    if(mode==="enter"){
      const h=await hashPin(kid.id,entry);
      if(h===kid.pin){ tone(988,.15,"triangle"); close(); onDone(); return; }

      kid.pin=await hashPin(kid.id,entry); cacheKids(); cloudSet(kid);
      msg.textContent=t("pinSaved"); tone(988,.15,"triangle");
      setTimeout(()=>{ close(); onDone(); },500); return;
    } else {
      first=null; entry=""; paint(); $("#pinTitle").textContent=title(); shake(t("pinMismatch"));
    }
    busy=false;
  }
  function press(k){
    if(busy) return;
    if(k==="del"){ entry=entry.slice(0,-1); paint(); return; }
    if(entry.length>=6) return;
    entry+=k; paint(); tone(600+entry.length*40,.06,"triangle",.12);
    if(entry.length===6) setTimeout(full,150);
  }
  function onKey(e){ if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==="Backspace") press("del"); else if(e.key==="Escape") close(); }
  document.addEventListener("keydown",onKey);
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>press(b.dataset.k));
  $("#pinX").onclick=close;
}

// ================= parent settings =================
function openSettings(){
  const link = location.origin + location.pathname + "#f=" + fam;
  $("#layer").innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">
    <h2>⚙️ ${t("settings")}</h2>
    <p class="small">${sync==="on"?"🟢 "+t("syncOn"):sync==="nonet"?"📡 "+t("syncNoNet"):sync==="off"?"⚠️ "+t("syncErr"):"⏳ "+t("syncWait")}</p>
    <div class="section"><b>${t("famCode")}</b><div class="code" id="fc">${fam}</div><p class="small">${t("famCodeNote")}</p>
      <button class="ghost soft" data-copy="${fam}">${t("copy")}</button></div>
    <div class="section"><b>${t("famLink")}</b><div class="code" style="font-size:.9rem">${esc(link)}</div><p class="small">${t("famLinkNote")}</p>
      <button class="ghost soft" data-copy="${esc(link)}">${t("copy")}</button></div>
    <form class="section" id="joinForm"><b>${t("join")}</b>
      <input id="joinCode" autocomplete="off" autocapitalize="off" spellcheck="false" dir="ltr" placeholder="abcd…">
      <p class="small" id="joinMsg"></p>
      <button class="ghost soft" type="submit">${t("joinBtn")}</button></form>
    <div class="section"><b>🔒 ${t("pins")}</b><p class="small">${t("pinResetNote")}</p>
      ${kids.map(k=>`<div class="pinrow"><span>${esc(k.avatar)} ${esc(kidName(k))}</span>${k.pin
        ?`<button class="ghost soft" data-reset="${esc(k.id)}">${t("pinReset")}</button>`
        :`<span class="small">${t("pinNone")}</span>`}</div>`).join("")}</div>
    <button class="big" id="closeS">${t("close")}</button>
  </div></div>`;
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
    try{ await navigator.clipboard.writeText(b.dataset.copy); b.textContent=t("copied"); }
    catch(e){ const r=document.createRange(); r.selectNodeContents(b.previousElementSibling.previousElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
  });
  $("#joinForm").onsubmit=e=>{
    e.preventDefault();
    const c=$("#joinCode").value.trim().toLowerCase().replace(/[^a-z0-9]/g,"");
    if(!validCode(c)){ $("#joinMsg").textContent=t("joinBad"); return; }
    fam=c; LS.set("nj_family",fam); kids=[]; cacheKids(); currentId=null;
    $("#layer").innerHTML=""; view="who"; render(); listen();
  };
  document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{
    if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent=t("pinResetSure"); return; }
    const k=kids.find(x=>x.id===b.dataset.reset); if(!k) return;
    delete k.pin; cacheKids(); cloudSet(k); b.replaceWith(Object.assign(document.createElement("span"),{className:"small",textContent:t("pinNone")}));
  });
  $("#closeS").onclick=()=>{$("#layer").innerHTML=""; render();};
}

// ================= cloud sync =================
let unsub=null, seeded=false;
function listen(){
  if(!F) return;
  if(unsub) unsub();
  seeded=false; setSync("wait");
  const col = F.collection(F.db,"families",fam,"kids");
  unsub = F.onSnapshot(col,{includeMetadataChanges:true}, snap=>{
    const fromServer = !snap.metadata.fromCache;
    if(fromServer) setSync("on");
    if(snap.empty && !fromServer) return;
    const r = ensureRoster(snap.docs.map(d=>({id:d.id,...d.data()})));
    kids = r.list;
    if(fromServer && !seeded){ seeded=true; r.fixes.forEach(cloudSet); }
    cacheKids();
    if(view.startsWith("g-")) refreshStars();
    else if(!$("#layer").innerHTML) render();
  }, err=>{ onCloudError(err); unsub=null; render(); });
}
async function startCloud(){
  try{
    const [{initializeApp},{getAuth,signInAnonymously,onAuthStateChanged},fs] = await Promise.all([
      import(FB+"firebase-app.js"), import(FB+"firebase-auth.js"), import(FB+"firebase-firestore.js")
    ]);
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let db;
    try{ db = fs.initializeFirestore(app,{localCache:fs.persistentLocalCache()}); }
    catch(e){ db = fs.getFirestore(app); }
    onAuthStateChanged(auth, user=>{
      if(!user){ signInAnonymously(auth).catch(e=>{ console.warn(e); setSync(navigator.onLine?"off":"nonet"); if(view==="who") render(); }); return; }
      if(F) return;
      F = {db, doc:fs.doc, collection:fs.collection, setDoc:fs.setDoc, updateDoc:fs.updateDoc, deleteDoc:fs.deleteDoc, onSnapshot:fs.onSnapshot, increment:fs.increment};
      listen();
    });
  }catch(e){
    console.warn("Firebase not loaded", e);
    setSync("nonet"); if(view==="who") render();
  }
}

// ================= night sky =================
function sky(){
  const c=$("#sky"),x=c.getContext("2d"),dpr=Math.min(2,window.devicePixelRatio||1);
  let pts=[];
  const size=()=>{c.width=innerWidth*dpr;c.height=innerHeight*dpr;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";
    pts=Array.from({length:70},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:(Math.random()*1.6+.4)*dpr,p:Math.random()*6}))};
  size(); addEventListener("resize",size);
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const draw=tm=>{x.clearRect(0,0,c.width,c.height);
    pts.forEach(s=>{x.globalAlpha=still?.7:.35+.45*Math.abs(Math.sin(tm/1400+s.p));x.fillStyle="#fffbe6";x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});
    if(!still) requestAnimationFrame(draw)};
  requestAnimationFrame(draw);
}

// ================= boot =================
sky(); render(); startCloud();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
